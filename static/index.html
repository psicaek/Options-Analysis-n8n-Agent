<!doctype html>
<html lang="el">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ticker Fundamentals</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #0b1020;
        --bg-2: #121a2f;
        --surface: rgba(255, 255, 255, 0.08);
        --surface-2: rgba(255, 255, 255, 0.12);
        --border: rgba(255, 255, 255, 0.14);
        --text: #f7f9fc;
        --muted: #aab4c8;
        --primary: #6ea8fe;
        --primary-2: #7c4dff;
        --good: #27ae60;
        --mid: #f39c12;
        --bad: #c0392b;
        --na: #7f8c8d;
        --shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
        --radius: 20px;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: "Inter", sans-serif;
        color: var(--text);
        background:
          radial-gradient(
            circle at top left,
            rgba(124, 77, 255, 0.35),
            transparent 30%
          ),
          radial-gradient(
            circle at top right,
            rgba(110, 168, 254, 0.28),
            transparent 28%
          ),
          linear-gradient(160deg, var(--bg), var(--bg-2));
        min-height: 100vh;
      }
      .wrap {
        max-width: 980px;
        margin: 0 auto;
        padding: 32px 16px 48px;
      }
      .card {
        background: var(--surface);
        backdrop-filter: blur(16px);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        overflow: hidden;
      }
      .hero {
        padding: 28px;
        background: linear-gradient(
          135deg,
          rgba(110, 168, 254, 0.18),
          rgba(124, 77, 255, 0.16)
        );
        border-bottom: 1px solid var(--border);
      }
      .hero h1 {
        margin: 0 0 8px;
        font-size: clamp(28px, 4vw, 42px);
        line-height: 1.05;
      }
      .hero p {
        margin: 0;
        color: var(--muted);
        font-size: 15px;
      }
      .controls {
        display: grid;
        grid-template-columns: 1.5fr 0.9fr 0.8fr;
        gap: 12px;
        padding: 20px 28px 10px;
      }
      input,
      select,
      button {
        font: inherit;
        border-radius: 14px;
        border: 1px solid var(--border);
        min-height: 48px;
      }
      input,
      select {
        padding: 0 14px;
        background: rgba(255, 255, 255, 0.08);
        color: var(--text);
      }
      input::placeholder {
        color: #90a0bd;
      }
      button {
        border: 0;
        background: linear-gradient(135deg, var(--primary), var(--primary-2));
        color: white;
        font-weight: 700;
        cursor: pointer;
      }
      button:hover {
        filter: brightness(1.05);
      }
      .status-row {
        padding: 0 28px 20px;
      }
      .spinner {
        display: none;
        align-items: center;
        gap: 10px;
        color: var(--muted);
        font-size: 14px;
      }
      .spinner::before {
        content: "";
        width: 18px;
        height: 18px;
        border-radius: 50%;
        border: 3px solid rgba(255, 255, 255, 0.2);
        border-top-color: var(--primary);
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      .error-box {
        display: none;
        background: rgba(192, 57, 43, 0.16);
        color: #ffd5cf;
        border: 1px solid rgba(192, 57, 43, 0.35);
        padding: 14px 16px;
        border-radius: 14px;
        font-size: 14px;
      }
      .result {
        display: none;
        padding: 0 28px 28px;
      }
      .top-grid {
        display: grid;
        grid-template-columns: 1.2fr 1fr;
        gap: 16px;
        margin-bottom: 16px;
      }
      .summary-box,
      .overall-box {
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid var(--border);
        border-radius: 18px;
        padding: 18px;
      }
      .kicker {
        color: var(--muted);
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        margin-bottom: 8px;
      }
      .ticker-line {
        display: flex;
        justify-content: space-between;
        align-items: end;
        gap: 12px;
      }
      .ticker-name {
        font-size: 30px;
        font-weight: 800;
      }
      .price {
        font-size: 28px;
        font-weight: 800;
        color: #b8d3ff;
      }
      .overall-score {
        font-size: 40px;
        font-weight: 800;
        line-height: 1;
      }
      .overall-sub {
        margin-top: 8px;
        color: var(--muted);
        font-size: 13px;
      }
      .metrics-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 14px;
      }
      .metric-card {
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid var(--border);
        border-radius: 18px;
        padding: 16px;
      }
      .metric-head {
        display: flex;
        justify-content: space-between;
        align-items: start;
        gap: 12px;
        margin-bottom: 8px;
      }
      .metric-title {
        font-size: 13px;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }
      .weight-badge,
      .score-badge {
        padding: 4px 8px;
        border-radius: 999px;
        font-size: 11px;
        font-weight: 700;
        white-space: nowrap;
      }
      .weight-badge {
        background: rgba(110, 168, 254, 0.14);
        color: #cfe1ff;
        border: 1px solid rgba(110, 168, 254, 0.26);
      }
      .score-badge.score-na {
        background: rgba(127, 140, 141, 0.18);
        color: #d4dbdc;
      }
      .score-badge.score-good {
        background: rgba(39, 174, 96, 0.18);
        color: #b9f1cb;
      }
      .score-badge.score-mid {
        background: rgba(243, 156, 18, 0.18);
        color: #ffdca3;
      }
      .score-badge.score-bad {
        background: rgba(192, 57, 43, 0.18);
        color: #ffc7bf;
      }
      .metric-value {
        font-size: 28px;
        font-weight: 800;
        margin-bottom: 8px;
      }
      .metric-desc {
        color: var(--muted);
        font-size: 13px;
        line-height: 1.45;
      }
      @media (max-width: 820px) {
        .controls,
        .top-grid,
        .metrics-grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="card">
        <div class="hero">
          <h1 id="titleText">📊 Θεμελιώδη Μετοχής</h1>
          <p id="subtitleText">
            Δείκτες αποτίμησης, κερδοφορίας και ένα σταθμισμένο συνολικό σκορ.
          </p>
        </div>

        <div class="controls">
          <input id="ticker" placeholder="AAPL" maxlength="10" />
          <select id="lang">
            <option value="el">Ελληνικά</option>
            <option value="en">English</option>
          </select>
          <button id="btn" onclick="run()">Λήψη</button>
        </div>

        <div class="status-row">
          <div class="spinner" id="spinner">Loading data...</div>
          <div class="error-box" id="errorBox"></div>
        </div>

        <div class="result" id="result">
          <div class="top-grid">
            <div class="summary-box">
              <div class="kicker" id="summaryLabel">Ticker & Price</div>
              <div class="ticker-line">
                <div class="ticker-name" id="outTicker">—</div>
                <div class="price" id="outPrice">—</div>
              </div>
            </div>
            <div class="overall-box">
              <div class="kicker" id="overallLabel">Συνολικό Σκορ</div>
              <div class="overall-score" id="overallScore">—</div>
              <div class="overall-sub" id="overallSub">
                Σταθμισμένο σκορ βάσει σημασίας κάθε δείκτη.
              </div>
            </div>
          </div>
          <div class="metrics-grid" id="metricsGrid"></div>
        </div>
      </div>
    </div>

    <script>
      const API_BASE = `${window.location.protocol}//${window.location.hostname}:7000`;

      const labels = {
        el: {
          title: "📊 Θεμελιώδη Μετοχής",
          subtitle:
            "Δείκτες αποτίμησης, κερδοφορίας και ένα σταθμισμένο συνολικό σκορ.",
          button: "Λήψη",
          summary: "Ticker & Τιμή",
          overall: "Συνολικό Σκορ",
          overallSub: "Σταθμισμένο σκορ βάσει σημασίας κάθε δείκτη.",
          trailingPE: {
            label: "P/E",
            desc: "Πόσο πληρώνει η αγορά για κάθε μονάδα κερδών. Συνήθως χαμηλότερο σημαίνει φθηνότερη αποτίμηση. Καλό συνήθως κάτω από 15, μέτριο 15-25, ακριβό πάνω από 25.",
          },
          forwardPE: {
            label: "Forward P/E",
            desc: "Όμοιο με το P/E αλλά με μελλοντικά εκτιμώμενα κέρδη, άρα είναι πιο αβέβαιο. Καλό συνήθως κάτω από 15, μέτριο 15-25, αδύναμο πάνω από 25.",
          },
          priceToSales: {
            label: "Price / Sales",
            desc: "Δείχνει πόσο ακριβά αποτιμάται η εταιρεία σε σχέση με τα έσοδά της. Καλό συνήθως κάτω από 2, μέτριο 2-5, ακριβό πάνω από 5.",
          },
          priceToBook: {
            label: "Price / Book",
            desc: "Συγκρίνει την τιμή της μετοχής με τη λογιστική αξία της εταιρείας. Καλό συνήθως κάτω από 3, μέτριο 3-5, ακριβό πάνω από 5.",
          },
          returnOnAssets: {
            label: "ROA",
            desc: "Πόσο αποτελεσματικά μετατρέπει η διοίκηση τα assets σε κέρδος. Καλό συνήθως πάνω από 10%, μέτριο 5-10%, αδύναμο κάτω από 5%.",
          },
          returnOnEquity: {
            label: "ROE",
            desc: "Το κέρδος που παράγεται πάνω στα ίδια κεφάλαια των μετόχων. Καλό συνήθως πάνω από 15%, πολύ δυνατό πάνω από 20%, αδύναμο κάτω από 10%.",
          },
          debtToEquity: {
            label: "Debt / Equity",
            desc: "Πόσο χρέος έχει η εταιρεία σε σχέση με τα ίδια κεφάλαια. Χαμηλότερο συνήθως είναι ασφαλέστερο. Καλό συνήθως κάτω από 60, μέτριο 60-120, πιεσμένο πάνω από 120.",
          },
          profitMargins: {
            label: "Profit Margin",
            desc: "Τι ποσοστό από τις πωλήσεις μένει τελικά ως καθαρό κέρδος. Καλό συνήθως πάνω από 10%, πολύ δυνατό πάνω από 20%, αδύναμο κάτω από 5%.",
          },
        },
        en: {
          title: "📊 Ticker Fundamentals",
          subtitle: "Valuation, profitability, and a weighted overall score.",
          button: "Get Data",
          summary: "Ticker & Price",
          overall: "Overall Score",
          overallSub: "Weighted score based on each metric's importance.",
          trailingPE: {
            label: "P/E",
            desc: "How much the market pays for each unit of earnings. Lower often means cheaper valuation. Usually good below 15, fair at 15-25, expensive above 25.",
          },
          forwardPE: {
            label: "Forward P/E",
            desc: "Similar to P/E but based on expected earnings, so it is less certain. Usually good below 15, fair at 15-25, weak above 25.",
          },
          priceToSales: {
            label: "Price / Sales",
            desc: "Shows how richly the company is valued relative to its revenue. Usually good below 2, fair at 2-5, expensive above 5.",
          },
          priceToBook: {
            label: "Price / Book",
            desc: "Compares market price with the company's accounting book value. Usually good below 3, fair at 3-5, expensive above 5.",
          },
          returnOnAssets: {
            label: "ROA",
            desc: "How efficiently management turns assets into profit. Usually good above 10%, fair at 5-10%, weak below 5%.",
          },
          returnOnEquity: {
            label: "ROE",
            desc: "Profit generated on shareholders' equity. Usually good above 15%, very strong above 20%, weak below 10%.",
          },
          debtToEquity: {
            label: "Debt / Equity",
            desc: "How much debt the company uses relative to equity. Lower is usually safer. Usually good below 60, fair at 60-120, stressed above 120.",
          },
          profitMargins: {
            label: "Profit Margin",
            desc: "How much of sales is kept as net profit. Usually good above 10%, very strong above 20%, weak below 5%.",
          },
        },
      };

      const weights = {
        trailingPE: 0.16,
        forwardPE: 0.08,
        priceToSales: 0.1,
        priceToBook: 0.08,
        returnOnAssets: 0.16,
        returnOnEquity: 0.22,
        debtToEquity: 0.08,
        profitMargins: 0.12,
      };

      function fmt(v) {
        if (v === null || v === undefined) return "—";
        if (typeof v === "number") return v.toFixed(2);
        return v;
      }
      function pct(v) {
        if (v === null || v === undefined) return "—";
        return (v * 100).toFixed(2) + "%";
      }
      function scoreClass(score) {
        if (score === null) return "score-na";
        if (score >= 8) return "score-good";
        if (score >= 5) return "score-mid";
        return "score-bad";
      }
      function overallColor(score) {
        if (score >= 8) return "#5fe08e";
        if (score >= 5) return "#ffd166";
        return "#ff8c7a";
      }

      function scorePE(v) {
        if (v === null || v === undefined || v <= 0) return null;
        if (v <= 10) return 10;
        if (v <= 15) return 9;
        if (v <= 20) return 8;
        if (v <= 25) return 6;
        if (v <= 35) return 4;
        if (v <= 50) return 2;
        return 1;
      }
      function scorePS(v) {
        if (v === null || v === undefined || v < 0) return null;
        if (v <= 1) return 10;
        if (v <= 2) return 9;
        if (v <= 4) return 7;
        if (v <= 6) return 5;
        if (v <= 10) return 3;
        return 1;
      }
      function scorePB(v) {
        if (v === null || v === undefined || v < 0) return null;
        if (v <= 1) return 10;
        if (v <= 2) return 8;
        if (v <= 4) return 6;
        if (v <= 6) return 4;
        if (v <= 10) return 2;
        return 1;
      }
      function scoreROA(v) {
        if (v === null || v === undefined) return null;
        const p = v * 100;
        if (p >= 20) return 10;
        if (p >= 15) return 9;
        if (p >= 10) return 8;
        if (p >= 6) return 6;
        if (p >= 3) return 4;
        if (p >= 0) return 2;
        return 1;
      }
      function scoreROE(v) {
        if (v === null || v === undefined) return null;
        const p = v * 100;
        if (p >= 30) return 10;
        if (p >= 22) return 9;
        if (p >= 16) return 8;
        if (p >= 10) return 6;
        if (p >= 5) return 4;
        if (p >= 0) return 2;
        return 1;
      }
      function scoreDE(v) {
        if (v === null || v === undefined || v < 0) return null;
        if (v <= 20) return 10;
        if (v <= 40) return 9;
        if (v <= 70) return 7;
        if (v <= 100) return 5;
        if (v <= 160) return 3;
        return 1;
      }
      function scoreMargin(v) {
        if (v === null || v === undefined) return null;
        const p = v * 100;
        if (p >= 25) return 10;
        if (p >= 18) return 9;
        if (p >= 12) return 8;
        if (p >= 7) return 6;
        if (p >= 3) return 4;
        if (p >= 0) return 2;
        return 1;
      }

      function metricDisplayValue(key, value) {
        if (["returnOnAssets", "returnOnEquity", "profitMargins"].includes(key))
          return pct(value);
        return fmt(value);
      }

      function applyLanguage(lang) {
        const L = labels[lang];
        document.documentElement.lang = lang === "el" ? "el" : "en";
        document.getElementById("titleText").textContent = L.title;
        document.getElementById("subtitleText").textContent = L.subtitle;
        document.getElementById("btn").textContent = L.button;
        document.getElementById("summaryLabel").textContent = L.summary;
        document.getElementById("overallLabel").textContent = L.overall;
        document.getElementById("overallSub").textContent = L.overallSub;
      }

      async function run() {
        const ticker = document
          .getElementById("ticker")
          .value.trim()
          .toUpperCase();
        const lang = document.getElementById("lang").value;
        const spinner = document.getElementById("spinner");
        const errorBox = document.getElementById("errorBox");
        const result = document.getElementById("result");
        const btn = document.getElementById("btn");

        if (!ticker) return;

        spinner.style.display = "flex";
        errorBox.style.display = "none";
        result.style.display = "none";
        btn.disabled = true;

        try {
          const res = await fetch(`${API_BASE}/fundamentals?tickers=${ticker}`);
          const data = await res.json();
          const d = data.results?.[0];
          if (!d || d.error) throw new Error(d?.error || "Unknown error");

          const L = labels[lang];
          document.getElementById("outTicker").textContent = d.ticker || ticker;
          document.getElementById("outPrice").textContent =
            d.price != null ? `$${fmt(d.price)}` : "—";

          const items = [
            ["trailingPE", d.trailingPE, scorePE(d.trailingPE)],
            ["forwardPE", d.forwardPE, scorePE(d.forwardPE)],
            ["priceToSales", d.priceToSales, scorePS(d.priceToSales)],
            ["priceToBook", d.priceToBook, scorePB(d.priceToBook)],
            ["returnOnAssets", d.returnOnAssets, scoreROA(d.returnOnAssets)],
            ["returnOnEquity", d.returnOnEquity, scoreROE(d.returnOnEquity)],
            ["debtToEquity", d.debtToEquity, scoreDE(d.debtToEquity)],
            ["profitMargins", d.profitMargins, scoreMargin(d.profitMargins)],
          ];

          let weightedSum = 0;
          let weightUsed = 0;
          for (const [key, , score] of items) {
            if (score !== null) {
              weightedSum += score * weights[key];
              weightUsed += weights[key];
            }
          }
          const overall =
            weightUsed > 0
              ? Math.round((weightedSum / weightUsed) * 10) / 10
              : null;
          const overallEl = document.getElementById("overallScore");
          overallEl.textContent = overall !== null ? `${overall}/10` : "N/A";
          overallEl.style.color =
            overall !== null ? overallColor(overall) : "#c8d0d8";

          const grid = document.getElementById("metricsGrid");
          grid.innerHTML = "";
          items.forEach(([key, value, score]) => {
            const cfg = L[key];
            const card = document.createElement("div");
            card.className = "metric-card";
            const scoreText = score === null ? "N/A" : `${score}/10`;
            card.innerHTML = `
        <div class="metric-head">
          <div class="metric-title">${cfg.label}</div>
          <div style="display:flex; gap:8px; align-items:center;">
            <span class="weight-badge">${Math.round(weights[key] * 100)}%</span>
            <span class="score-badge ${scoreClass(score)}">${scoreText}</span>
          </div>
        </div>
        <div class="metric-value">${metricDisplayValue(key, value)}</div>
        <div class="metric-desc">${cfg.desc}</div>
      `;
            grid.appendChild(card);
          });

          result.style.display = "block";
        } catch (err) {
          errorBox.textContent = "⚠ " + err.message;
          errorBox.style.display = "block";
        } finally {
          spinner.style.display = "none";
          btn.disabled = false;
        }
      }

      document
        .getElementById("lang")
        .addEventListener("change", (e) => applyLanguage(e.target.value));
      document.getElementById("ticker").addEventListener("keypress", (e) => {
        if (e.key === "Enter") run();
      });
      applyLanguage(document.getElementById("lang").value);
    </script>
  </body>
</html>
